services:
  backend:
    build: ./backend
    container_name: archer-backend
    restart: always
    ports:
      - "2000:2000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/archer_app
      - PORT=2000
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    container_name: archer-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
